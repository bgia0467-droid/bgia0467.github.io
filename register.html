<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Đăng ký | mobi+</title><link rel="stylesheet" href="css/style.css"><script defer src="js/data.js"></script><script defer src="js/main.js"></script><script defer src="js/cart.js"></script></head><body><div data-site-header></div><main><section class="form-shell"><div class="eyebrow">Trở thành thành viên</div><h1>Tạo tài khoản</h1><p>Lưu thông tin để thanh toán nhanh hơn lần sau.</p><div id="form-message" role="status" style="color:#b34d39;font-size:13px"></div><form class="stack-form" id="register-form"><label>Họ và tên<input class="field" name="name" required autocomplete="name" placeholder="Nguyễn Minh Anh"></label><label>Email<input class="field" name="email" type="email" required autocomplete="email" placeholder="ten@email.com"></label><label>Mật khẩu<input class="field" name="password" type="password" minlength="6" required autocomplete="new-password" placeholder="Ít nhất 6 ký tự"></label><label>Xác nhận mật khẩu<input class="field" name="confirm" type="password" minlength="6" required autocomplete="new-password" placeholder="Nhập lại mật khẩu"></label><button class="btn btn-dark">Tạo tài khoản</button></form><p class="form-foot">Đã có tài khoản? <a class="text-link" href="login.html">Đăng nhập</a></p></section></main><div data-site-footer></div></body></html>
