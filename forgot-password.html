<!doctype html>
<html lang="vi">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,initial-scale=1">
	<title>Quên mật khẩu | mobi+</title>
	<link rel="stylesheet" href="css/style.css">
	<script defer src="js/data.js"></script>
	<script defer src="js/main.js"></script>
	<script defer src="js/cart.js"></script>
</head>
<body>
	<div data-site-header></div>
	<main>
		<section class="form-shell">
			<div class="eyebrow">Khôi phục tài khoản</div>
			<h1>Đặt lại mật khẩu</h1>
			<p>Nhập email đã đăng ký và tạo mật khẩu mới cho tài khoản demo trên trình duyệt này.</p>
			<div id="form-message" role="status" style="font-size:13px"></div>
			<form class="stack-form" id="forgot-form">
				<label>Email<input class="field" name="email" type="email" required autocomplete="email"></label>
				<label>Mật khẩu mới<input class="field" name="password" type="password" minlength="6" required autocomplete="new-password"></label>
				<label>Xác nhận mật khẩu<input class="field" name="confirm" type="password" minlength="6" required autocomplete="new-password"></label>
				<button class="btn btn-dark">Cập nhật mật khẩu</button>
			</form>
			<p class="form-foot"><a class="text-link" href="login.html">Quay lại đăng nhập</a></p>
		</section>
	</main>
	<div data-site-footer></div>
</body>
</html>
