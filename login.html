<!doctype html>
<html lang="vi">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,initial-scale=1">
	<title>Đăng nhập | mobi+</title>
	<link rel="stylesheet" href="css/style.css">
	<script defer src="js/data.js"></script>
	<script defer src="js/main.js"></script>
	<script defer src="js/cart.js"></script>
</head>
<body>
	<div data-site-header></div>
	<main>
		<section class="form-shell">
			<div class="eyebrow">Chào mừng trở lại</div>
			<h1>Đăng nhập</h1>
			<p>Đăng nhập để tiếp tục trải nghiệm mua sắm.</p>
			<div id="form-message" role="status" style="color:#b34d39;font-size:13px"></div>
			<form class="stack-form" id="login-form">
				<label>Email<input class="field" name="email" type="email" required autocomplete="email" placeholder="ten@email.com"></label>
				<label>Mật khẩu<input class="field" name="password" type="password" required autocomplete="current-password" placeholder="Nhập mật khẩu"></label>
				<label style="display:flex;align-items:center;gap:8px"><input name="remember" type="checkbox" checked> Ghi nhớ đăng nhập trên thiết bị này</label>
				<button class="btn btn-dark">Đăng nhập</button>
			</form>
			<p class="form-foot"><a class="text-link" href="forgot-password.html">Quên mật khẩu?</a></p>
			<p class="form-foot">Chưa có tài khoản? <a class="text-link" href="register.html">Đăng ký ngay</a></p>
			<p class="form-foot">Trạng thái đăng nhập chỉ lưu tên và email; tài khoản demo lưu trên trình duyệt này.</p>
			<p class="form-foot">Bạn là quản trị viên? <a class="text-link" href="admin/login.html">Đăng nhập quản trị viên</a></p>
		</section>
	</main>
	<div data-site-footer></div>
</body>
</html>
