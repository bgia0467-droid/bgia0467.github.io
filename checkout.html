<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Thanh toán | mobi+</title><link rel="stylesheet" href="css/style.css"><script defer src="js/data.js"></script><script defer src="js/main.js"></script><script defer src="js/cart.js"></script></head><body><div data-site-header></div><main class="wrap"><header class="page-hero"><div class="eyebrow">Thanh toán an toàn</div><h1>Thông tin giao hàng</h1><p>Nhập thông tin để chúng tôi giao sản phẩm đến bạn.</p></header><div class="checkout-layout"><form id="checkout-form"><section class="checkout-block"><h2>Thông tin người nhận</h2><div class="form-grid"><label>Họ và tên<input class="field" id="customer-name" name="name" required autocomplete="name"></label><label>Email<input class="field" id="customer-email" name="email" type="email" required autocomplete="email"></label><label>Số điện thoại<input class="field" name="phone" type="tel" required autocomplete="tel" pattern="\+?[0-9 ]{9,15}" placeholder="090 123 4567"></label><label>Tỉnh / thành phố<input class="field" name="city" required autocomplete="address-level1" placeholder="TP. Hồ Chí Minh"></label><label class="wide">Quận / huyện<input class="field" name="district" required autocomplete="address-level2" placeholder="Quận 1"></label><label class="wide">Địa chỉ cụ thể<input class="field" name="address" required autocomplete="street-address" placeholder="Số nhà, tên đường"></label><label class="wide">Ghi chú<textarea class="field" name="note" rows="3" style="height:auto;padding:12px" placeholder="Ghi chú cho người giao hàng"></textarea></label></div></section><section class="checkout-block"><h2>Phương thức thanh toán</h2><div class="stack-form" style="margin-top:0"><label><input type="radio" name="payment" value="cod" checked> Thanh toán khi nhận hàng (COD)</label><label><input type="radio" name="payment" value="bank"> Chuyển khoản ngân hàng (demo)</label></div></section><button class="btn btn-dark" id="place-order" style="width:100%">Xác nhận đặt hàng</button></form><aside class="summary"><h2>Đơn hàng của bạn</h2><div id="checkout-summary-items"></div><div class="summary-line"><span>Giao hàng</span><strong>Miễn phí</strong></div><div class="summary-line summary-total"><span>Tổng cộng</span><strong id="checkout-total"></strong></div></aside></div></main><div data-site-footer></div></body></html>
